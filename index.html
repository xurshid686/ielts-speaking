<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speak Up! · IELTS Speaking Practice</title>
  <meta name="description" content="A friendly day-by-day IELTS Speaking practice site with sample answers, ideas, grammar tips, a Part 2 timer and a voice recorder." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>" />
</head>
<body>

  <!-- ============================= HEADER ============================= -->
  <header class="site-header">
    <div class="brand">
      <span class="brand-emoji">🎤</span>
      <div>
        <h1>Speak Up!</h1>
        <p class="tagline">IELTS Speaking · day-by-day practice</p>
      </div>
    </div>
    <button id="menuToggle" class="menu-toggle" aria-label="Toggle day list">☰ Days</button>
  </header>

  <div class="layout">

    <!-- ============================= SIDEBAR (DAY LIST) ============================= -->
    <aside id="sidebar" class="sidebar">
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="🔍 Search a topic…" aria-label="Search topics" />
      </div>
      <nav id="dayList" class="day-list" aria-label="Days"></nav>
    </aside>

    <!-- ============================= MAIN CONTENT ============================= -->
    <main id="content" class="content">
      <!-- Day content is rendered here by app.js -->
    </main>

  </div>

  <footer class="site-footer">
    <p>Made for hard-working IELTS students · <span id="dayCount"></span> days of practice 💪</p>
  </footer>

  <!-- Data first, then app logic -->
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
